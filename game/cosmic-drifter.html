<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Drifter</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{display:flex;justify-content:center;align-items:center;min-height:100vh;background:#000;overflow:hidden;font-family:'Segoe UI',Tahoma,sans-serif;user-select:none}
canvas{display:block;cursor:none}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#hud{display:flex;justify-content:space-between;padding:8px 15px;font-size:13px;color:rgba(255,255,255,0.7)}
.hud-group{display:flex;gap:20px;align-items:center}
.hud-item{display:flex;align-items:center;gap:5px}
.hud-label{text-transform:uppercase;letter-spacing:1px;font-size:10px;color:rgba(255,255,255,0.4)}
.hud-value{font-size:16px;font-weight:bold}
.bar-container{width:120px;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;transition:width 0.2s}
#healthBar{background:linear-gradient(90deg,#ff2266,#ff4488)}
#shieldBar{background:linear-gradient(90deg,#00ccff,#0088ff)}
#xpBar{background:linear-gradient(90deg,#44ff88,#00cc44)}
#expBar{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:300px;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden}
#expFill{height:100%;background:linear-gradient(90deg,#44ff88,#00cc44);border-radius:2px;transition:width 0.2s}
#levelBadge{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(255,255,255,0.4);letter-spacing:2px}
#weaponBar{position:absolute;bottom:15px;left:15px;display:flex;gap:6px}
.weapon-slot{width:36px;height:36px;border:2px solid rgba(255,255,255,0.15);border-radius:6px;display:flex;justify-content:center;align-items:center;font-size:10px;color:rgba(255,255,255,0.3);position:relative;transition:all 0.2s}
.weapon-slot.active{border-color:rgba(0,200,255,0.7);box-shadow:0 0 10px rgba(0,200,255,0.3)}
.weapon-slot .slot-key{position:absolute;top:-2px;right:2px;font-size:8px;color:rgba(255,255,255,0.3)}
#abilityBar{position:absolute;bottom:15px;right:15px;display:flex;gap:6px}
.ability-slot{width:40px;height:40px;border:2px solid rgba(255,255,255,0.15);border-radius:8px;display:flex;justify-content:center;align-items:center;font-size:18px;position:relative;overflow:hidden}
.ability-slot .cooldown-overlay{position:absolute;bottom:0;left:0;width:100%;background:rgba(0,0,0,0.7);transition:height 0.1s}
.ability-slot .ability-key{position:absolute;top:0;left:3px;font-size:9px;color:rgba(255,255,255,0.4)}
#comboDisplay{position:absolute;top:50px;right:20px;text-align:right}
#comboCount{font-size:32px;font-weight:bold;color:#ffcc00;text-shadow:0 0 20px rgba(255,204,0,0.5);transition:all 0.1s}
#comboLabel{font-size:10px;color:rgba(255,204,0,0.5);text-transform:uppercase;letter-spacing:2px}
#minimap{position:absolute;top:50px;right:15px;width:100px;height:100px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;background:rgba(0,0,0,0.3);overflow:hidden}
#minimapCanvas{width:100%;height:100%}
#bossWarning{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity 0.5s}
#bossWarning h2{font-size:28px;color:#ff2244;text-shadow:0 0 30px rgba(255,34,68,0.8);letter-spacing:6px;animation:bossPulse 0.5s infinite alternate}
@keyframes bossPulse{from{transform:scale(1)}to{transform:scale(1.05)}}
#bossWarning .boss-name{font-size:14px;color:rgba(255,255,255,0.6);letter-spacing:4px;margin-top:5px}
#bossHealth{position:absolute;top:60px;left:50%;transform:translateX(-50%);width:400px;display:none}
#bossHealth .boss-label{text-align:center;font-size:11px;color:#ff4466;letter-spacing:3px;margin-bottom:4px}
#bossHealth .boss-bar-bg{width:100%;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden}
#bossHealth .boss-bar-fill{height:100%;background:linear-gradient(90deg,#ff2244,#ff6644);border-radius:3px;transition:width 0.3s}
#messageArea{position:absolute;top:30%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.message{font-size:16px;color:#fff;text-shadow:0 0 10px rgba(255,255,255,0.5);opacity:0;transition:all 0.3s;margin:3px 0}
#screenOverlay{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,0.8);z-index:100;pointer-events:auto;backdrop-filter:blur(8px)}
#screenOverlay.hidden{display:none}
#screenOverlay2.hidden{display:none}
#screenOverlay h1{font-size:48px;background:linear-gradient(135deg,#00ccff,#ff00ff,#ffcc00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px;letter-spacing:4px}
#screenOverlay h2{font-size:32px;background:linear-gradient(90deg,#ff2244,#ff6644);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:15px;letter-spacing:3px}
#screenOverlay .subtitle{color:rgba(255,255,255,0.5);font-size:14px;margin-bottom:30px}
#screenOverlay .final-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;margin-bottom:25px;font-size:14px}
.stat-row{display:flex;justify-content:space-between;gap:20px}
.stat-row .label{color:rgba(255,255,255,0.4)}
.stat-row .value{color:#00ccff;font-weight:bold}
.btn{padding:12px 35px;font-size:14px;font-weight:bold;border:none;border-radius:25px;cursor:pointer;transition:all 0.3s;text-transform:uppercase;letter-spacing:2px;margin:5px}
.btn-primary{background:linear-gradient(135deg,#00ccff,#0066ff);color:#fff;box-shadow:0 0 25px rgba(0,100,255,0.4)}
.btn-primary:hover{transform:scale(1.05);box-shadow:0 0 40px rgba(0,100,255,0.6)}
.btn-secondary{background:transparent;border:2px solid rgba(255,0,255,0.4);color:#ff00ff}
.btn-secondary:hover{background:rgba(255,0,255,0.1)}
.controls-info{margin-top:25px;color:rgba(255,255,255,0.3);font-size:12px;text-align:center;line-height:1.8}
.controls-info kbd{background:rgba(255,255,255,0.1);padding:2px 8px;border-radius:4px;border:1px solid rgba(255,255,255,0.2);font-size:11px}
#waveIndicator{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity 0.5s;pointer-events:none}
#waveIndicator h3{font-size:36px;color:#fff;text-shadow:0 0 20px rgba(255,255,255,0.5);letter-spacing:4px}
#waveIndicator .wave-sub{font-size:14px;color:rgba(255,255,255,0.4);letter-spacing:2px}
#pickupIndicator{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
.pickup-badge{padding:4px 12px;border-radius:12px;font-size:11px;font-weight:bold;animation:pickupPulse 1s infinite}
@keyframes pickupPulse{0%,100%{opacity:1}50%{opacity:0.6}}
#damageFlash{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(255,0,0,0) 100%);z-index:5;opacity:0;transition:opacity 0.1s}
#starfield{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0}
</style>
</head>
<body>
<canvas id="gc"></canvas>
<div id="ui">
  <div id="hud">
    <div class="hud-group">
      <div class="hud-item"><span class="hud-label">HP</span><div class="bar-container"><div class="bar-fill" id="healthBar" style="width:100%"></div></div></div>
      <div class="hud-item"><span class="hud-label">SH</span><div class="bar-container"><div class="bar-fill" id="shieldBar" style="width:100%"></div></div></div>
    </div>
    <div class="hud-group">
      <div class="hud-item"><span class="hud-label">Score</span><span class="hud-value" id="scoreDisplay" style="color:#ffcc00">0</span></div>
      <div class="hud-item"><span class="hud-label">Wave</span><span class="hud-value" id="waveDisplay" style="color:#00ccff">1</span></div>
      <div class="hud-item"><span class="hud-label">Time</span><span class="hud-value" id="timeDisplay" style="color:#aaa">0:00</span></div>
    </div>
  </div>
  <div id="expBar"><div id="expFill" style="width:0%"></div></div>
  <div id="levelBadge">LEVEL 1</div>
  <div id="weaponBar"></div>
  <div id="abilityBar"></div>
  <div id="comboDisplay"><div id="comboCount"></div><div id="comboLabel">Combo</div></div>
  <div id="minimap"><canvas id="minimapCanvas"></canvas></div>
  <div id="bossWarning"><h2>⚠ WARNING ⚠</h2><div class="boss-name" id="bossName"></div></div>
  <div id="bossHealth" style="display:none"><div class="boss-label" id="bossLabel"></div><div class="boss-bar-bg"><div class="boss-bar-fill" id="bossBarFill" style="width:100%"></div></div></div>
  <div id="messageArea"></div>
  <div id="waveIndicator"><h3 id="waveText">WAVE 1</h3><div class="wave-sub">Incoming!</div></div>
  <div id="pickupIndicator"></div>
  <div id="damageFlash"></div>
</div>
<div id="screenOverlay">
  <h1>COSMIC DRIFTER</h1>
  <div class="subtitle">Survive the endless void</div>
  <button class="btn btn-primary" id="startBtn">LAUNCH</button>
  <div class="controls-info">
    <kbd>WASD</kbd> Move &nbsp; <kbd>Mouse</kbd> Aim &nbsp; <kbd>Click</kbd> Shoot &nbsp;<br>
    <kbd>1-4</kbd> Weapons &nbsp; <kbd>Q</kbd> <kbd>E</kbd> Abilities &nbsp; <kbd>Shift</kbd> Dash &nbsp; <kbd>Space</kbd> Shield
  </div>
</div>
<div id="screenOverlay2" style="position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;justify-content:center;align-items:center;background:rgba(0,0,0,0.85);z-index:100;backdrop-filter:blur(8px)">
  <h2>GAME OVER</h2>
  <div class="final-stats" id="finalStats"></div>
  <button class="btn btn-primary" id="retryBtn">RETRY</button>
</div>

<script>
// ===== AUDIO ENGINE =====
const AC=window.AudioContext||window.webkitAudioContext;
let ac=null;
function initAudio(){if(!ac)ac=new AC()}
function playSnd(freq,dur,type='sine',vol=0.15,slide=0){
  if(!ac)return;
  const o=ac.createOscillator(),g=ac.createGain();
  o.connect(g);g.connect(ac.destination);
  o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+dur);
  g.gain.setValueAtTime(vol,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
  o.start(ac.currentTime);o.stop(ac.currentTime+dur);
}
function playNoise(dur,vol=0.1){
  if(!ac)return;
  const b=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const s=ac.createBufferSource();s.buffer=b;
  const g=ac.createGain();g.gain.setValueAtTime(vol,ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
  s.connect(g);g.connect(ac.destination);s.start();
}
const SFX={
  shoot:()=>playSnd(800,0.08,'square',0.08,400),
  shootHeavy:()=>playSnd(200,0.15,'sawtooth',0.12,80),
  shootPlasma:()=>playSnd(1200,0.1,'sine',0.1,600),
  shootSpread:()=>playSnd(600,0.06,'triangle',0.07,300),
  hit:()=>playSnd(300,0.08,'square',0.1,100),
  explosion:()=>{playNoise(0.3,0.15);playSnd(80,0.3,'sawtooth',0.12,20)},
  bigExplosion:()=>{playNoise(0.6,0.25);playSnd(50,0.5,'sawtooth',0.15,15)},
  pickup:()=>{playSnd(660,0.1,'sine',0.12);setTimeout(()=>playSnd(880,0.1,'sine',0.12),80)},
  powerup:()=>{playSnd(440,0.1,'sine',0.15);setTimeout(()=>playSnd(660,0.1,'sine',0.15),100);setTimeout(()=>playSnd(880,0.15,'sine',0.15),200)},
  dash:()=>playSnd(200,0.15,'sine',0.1,800),
  shield:()=>playSnd(400,0.2,'sine',0.08,1200),
  shieldHit:()=>playSnd(150,0.15,'square',0.12,600),
  levelUp:()=>{[440,554,659,880].forEach((f,i)=>setTimeout(()=>playSnd(f,0.15,'sine',0.12),i*100))},
  death:()=>{playSnd(300,0.5,'sawtooth',0.15,40);playNoise(0.5,0.2)},
  bossWarn:()=>{playSnd(100,0.5,'square',0.15,50);setTimeout(()=>playSnd(100,0.5,'square',0.15,50),600)},
  combo:()=>playSnd(1000,0.08,'sine',0.06,1500),
};

// ===== CANVAS SETUP =====
const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');
const mmCanvas=document.getElementById('minimapCanvas');
const mmCtx=mmCanvas.getContext('2d');
function resize(){
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  mmCanvas.width=100;mmCanvas.height=100;
}
resize();window.addEventListener('resize',resize);

// ===== GAME STATE =====
let state='menu';//menu,playing,paused,dead
let score=0;
let wave=1;
let waveTimer=0;
let waveDelay=0;
let gameTime=0;
let combo=0;
let comboTimer=0;
let maxCombo=0;
let totalKills=0;
let totalDamageDealt=0;
let totalDamageTaken=0;
let bossActive=false;
let boss=null;
let screenShake=0;
let screenShakeX=0,screenShakeY=0;
let damageFlash=0;
let slowMotion=1;
let slowMotionTimer=0;

// ===== CAMERA =====
let camX=0,camY=0,camShakeX=0,camShakeY=0;

// ===== PLAYER =====
const P={
  x:0,y:0,r:16,
  hp:100,maxHp:100,
  shield:50,maxShield:50,
  shieldRegen:0.3,shieldDelay:0,shieldRegenDelay:120,
  speed:4,
  xp:0,xpToLevel:100,level:1,
  invincible:0,
  dashCooldown:0,dashTimer:0,dashDir:{x:0,y:0},
  shieldActive:false,shieldCooldown:0,shieldDuration:0,
  weapons:[],
  currentWeapon:0,
  abilities:[],
  facing:0,
  vx:0,vy:0,
};

// ===== WEAPONS =====
const WEAPON_DEFS=[
  {name:'Pulse Cannon',key:'1',color:'#00ccff',fireRate:8,bulletSpeed:12,bulletDmg:8,bulletSize:4,spread:0,bullets:1,type:'normal'},
  {name:'Plasma Beam',key:'2',color:'#ff00ff',fireRate:4,bulletSpeed:18,bulletDmg:4,bulletSize:3,spread:0.05,bullets:1,type:'plasma'},
  {name:'Scatter Gun',key:'3',color:'#ffcc00',fireRate:20,bulletSpeed:10,bulletDmg:5,bulletSize:3,spread:0.3,bullets:5,type:'spread'},
  {name:'Void Cannon',key:'4',color:'#ff4444',fireRate:40,bulletSpeed:8,bulletDmg:35,bulletSize:8,spread:0,bullets:1,type:'heavy'},
];
P.weapons=WEAPON_DEFS.map(w=>({...w,cooldown:0,level:1}));

// ===== ABILITIES =====
const ABILITY_DEFS=[
  {name:'Nova Burst',key:'Q',icon:'💥',cooldown:300,duration:0,desc:'AOE damage'},
  {name:'Time Warp',key:'E',icon:'⏳',cooldown:420,duration:180,desc:'Slow enemies'},
];
P.abilities=ABILITY_DEFS.map(a=>({...a,currentCooldown:0,active:false}));

// ===== INPUT =====
let keys={};
let mouseX=0,mouseY=0,mouseDown=false;
let mouseWorldX=0,mouseWorldY=0;
document.addEventListener('keydown',e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key>='1'&&e.key<='4'){P.currentWeapon=parseInt(e.key)-1;updateWeaponUI()}
  if(e.key.toLowerCase()==='q')useAbility(0);
  if(e.key.toLowerCase()==='e')useAbility(1);
  if(e.key==='Shift')dash();
  if(e.key===' ')e.preventDefault();
});
document.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
canvas.addEventListener('mousemove',e=>{
  const rect=canvas.getBoundingClientRect();
  mouseX=e.clientX-rect.left;mouseY=e.clientY-rect.top;
});
canvas.addEventListener('mousedown',e=>{mouseDown=true});
canvas.addEventListener('mouseup',e=>{mouseDown=false});

// ===== ENTITIES =====
let bullets=[];
let enemyBullets=[];
let enemies=[];
let particles=[];
let pickups=[];
let damageNumbers=[];
let stars=[];
let nebulas=[];

// ===== STARFIELD =====
function initStars(){
  stars=[];
  for(let i=0;i<300;i++){
    stars.push({
      x:Math.random()*3000-1500,y:Math.random()*3000-1500,
      z:Math.random()*3+0.5,
      size:Math.random()*2+0.5,
      brightness:Math.random()*0.5+0.3,
      color:Math.random()>0.7?'hsl('+Math.random()*360+',80%,70%)':'#fff'
    });
  }
  nebulas=[];
  for(let i=0;i<8;i++){
    nebulas.push({
      x:Math.random()*3000-1500,y:Math.random()*3000-1500,
      r:Math.random()*200+100,
      color:'hsla('+Math.random()*360+',60%,30%,0.03)',
    });
  }
}

// ===== ENEMY TYPES =====
const ENEMY_TYPES={
  drone:{hp:15,speed:2,size:12,color:'#ff4466',score:10,dmg:8,behavior:'chase',fireRate:0,bulletSpeed:0},
  fighter:{hp:30,speed:1.5,size:14,color:'#ff8800',score:25,dmg:12,behavior:'strafe',fireRate:90,bulletSpeed:5},
  sniper:{hp:20,speed:1,size:10,color:'#cc00ff',score:30,dmg:15,behavior:'keepDistance',fireRate:120,bulletSpeed:8},
  tank:{hp:80,speed:0.8,size:22,color:'#44ff44',score:50,dmg:20,behavior:'chase',fireRate:60,bulletSpeed:4},
  swarmer:{hp:8,speed:3,size:8,color:'#ffff00',score:5,dmg:5,behavior:'swarm',fireRate:0,bulletSpeed:0},
  bomber:{hp:40,speed:1.2,size:16,color:'#ff6600',score:35,dmg:25,behavior:'chase',fireRate:180,bulletSpeed:3},
  elite:{hp:120,speed:1.8,size:18,color:'#ff00ff',score:75,dmg:18,behavior:'strafe',fireRate:50,bulletSpeed:6},
};
const BOSS_TYPES=[
  {name:'VOID DESTROYER',hp:800,size:50,color:'#ff2244',score:500,dmg:25,behavior:'boss1',fireRate:40,bulletSpeed:5,phases:3},
  {name:'NEBULA GUARDIAN',hp:1500,size:60,color:'#8800ff',score:1000,dmg:30,behavior:'boss2',fireRate:30,bulletSpeed:6,phases:3},
  {name:'STAR DEVOURER',hp:2500,size:70,color:'#ff8800',score:2000,dmg:35,behavior:'boss2',fireRate:20,bulletSpeed:7,phases:4},
];

// ===== SPAWNING =====
let spawnTimer=0;
function spawnEnemy(){
  const types=Object.keys(ENEMY_TYPES);
  let available=['drone'];
  if(wave>=2)available.push('fighter');
  if(wave>=3)available.push('sniper','swarmer');
  if(wave>=5)available.push('tank');
  if(wave>=7)available.push('bomber');
  if(wave>=10)available.push('elite');
  
  const typeKey=available[Math.floor(Math.random()*available.length)];
  const type=ENEMY_TYPES[typeKey];
  const angle=Math.random()*Math.PI*2;
  const dist=Math.max(canvas.width,canvas.height)*0.6+Math.random()*200;
  
  const mult=1+(wave-1)*0.15;
  enemies.push({
    x:P.x+Math.cos(angle)*dist,
    y:P.y+Math.sin(angle)*dist,
    ...type,
    hp:type.hp*mult,maxHp:type.hp*mult,
    fireTimer:Math.random()*type.fireRate,
    angle:0,
    phase:0,
    strafeDir:Math.random()>0.5?1:-1,
    spawnTime:0,
  });
}

function spawnBoss(){
  const bossIdx=Math.min(Math.floor((wave-1)/5),BOSS_TYPES.length-1);
  const bt=BOSS_TYPES[bossIdx];
  bossActive=true;
  SFX.bossWarn();
  showBossWarning(bt.name);
  boss={
    x:P.x+400,y:P.y,
    ...bt,
    hp:bt.hp*(1+(wave-1)*0.3),maxHp:bt.hp*(1+(wave-1)*0.3),
    fireTimer:0,angle:0,phase:0,phaseHp:0,
    moveTimer:0,targetX:P.x,targetY:P.y,
    active:true,
  };
  document.getElementById('bossHealth').style.display='block';
  document.getElementById('bossLabel').textContent=bt.name;
}

// ===== PICKUPS =====
const PICKUP_TYPES={
  health:{color:'#ff4466',icon:'❤',effect:'hp'},
  shield:{color:'#00ccff',icon:'🛡',effect:'shield'},
  xp:{color:'#44ff88',icon:'✦',effect:'xp'},
  weapon:{color:'#ffcc00',icon:'⚡',effect:'weapon'},
  power:{color:'#ff00ff',icon:'★',effect:'power'},
};

function spawnPickup(x,y,type){
  pickups.push({x,y,type:PICKUP_TYPES[type],r:10,life:600,age:0});
}

function spawnLoot(x,y){
  const r=Math.random();
  if(r<0.3)spawnPickup(x,y,'health');
  else if(r<0.5)spawnPickup(x,y,'shield');
  else if(r<0.7)spawnPickup(x,y,'xp');
  else if(r<0.85)spawnPickup(x,y,'weapon');
  else spawnPickup(x,y,'power');
}

// ===== PARTICLES =====
function addParticle(x,y,color,count=1,opts={}){
  for(let i=0;i<count;i++){
    const angle=opts.angle!==undefined?opts.angle+opts.spread*(Math.random()-0.5):Math.random()*Math.PI*2;
    const speed=opts.speed||2+Math.random()*4;
    particles.push({
      x,y,
      vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,
      life:1,decay:opts.decay||(0.02+Math.random()*0.03),
      size:opts.size||(2+Math.random()*3),
      color,gravity:opts.gravity||0,
      type:opts.type||'circle',
    });
  }
}

function addExplosion(x,y,color,size=1){
  addParticle(x,y,color,Math.floor(15*size),{speed:5,gravity:0});
  addParticle(x,y,'#fff',Math.floor(5*size),{speed:3,size:1});
  addParticle(x,y,'#ffcc00',Math.floor(8*size),{speed:2,decay:0.04});
}

function addDamageNumber(x,y,dmg,crit){
  damageNumbers.push({
    x,y,text:Math.round(dmg).toString(),life:1,
    vy:-2,color:crit?'#ffcc00':'#fff',
    size:crit?18:12,
  });
}

// ===== SHOOTING =====
function shoot(){
  const w=P.weapons[P.currentWeapon];
  if(w.cooldown>0)return;
  w.cooldown=w.fireRate;
  
  for(let i=0;i<w.bullets;i++){
    const spread=w.spread*(i-(w.bullets-1)/2);
    const angle=P.facing+spread;
    bullets.push({
      x:P.x+Math.cos(P.facing)*20,
      y:P.y+Math.sin(P.facing)*20,
      vx:Math.cos(angle)*w.bulletSpeed,
      vy:Math.sin(angle)*w.bulletSpeed,
      dmg:w.bulletDmg*w.level,
      size:w.bulletSize,
      color:w.color,
      life:120,
      type:w.type,
      piercing:w.type==='plasma'?1:0,
    });
  }
  
  if(w.type==='heavy')SFX.shootHeavy();
  else if(w.type==='plasma')SFX.shootPlasma();
  else if(w.type==='spread')SFX.shootSpread();
  else SFX.shoot();
  
  // Muzzle flash
  addParticle(P.x+Math.cos(P.facing)*22,P.y+Math.sin(P.facing)*22,w.color,3,{speed:2,size:3,decay:0.1});
}

// ===== ENEMY SHOOTING =====
function enemyShoot(e){
  if(e.fireRate<=0)return;
  e.fireTimer--;
  if(e.fireTimer>0)return;
  e.fireTimer=e.fireRate;
  
  const dx=P.x-e.x,dy=P.y-e.y;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>800)return;
  
  if(e.behavior==='boss1'){
    // Boss1: spiral pattern
    for(let i=0;i<8;i++){
      const a=e.angle+i*Math.PI/4;
      enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(a)*e.bulletSpeed,vy:Math.sin(a)*e.bulletSpeed,r:5,color:'#ff4466',dmg:e.dmg,life:180});
    }
    e.angle+=0.3;
  } else if(e.behavior==='boss2'){
    // Boss2: aimed + spread
    const base=Math.atan2(dy,dx);
    for(let i=-2;i<=2;i++){
      enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(base+i*0.2)*e.bulletSpeed,vy:Math.sin(base+i*0.2)*e.bulletSpeed,r:6,color:'#8800ff',dmg:e.dmg,life:180});
    }
  } else {
    // Normal aimed shot
    const a=Math.atan2(dy,dx);
    const spread=e.behavior==='sniper'?0:0.1;
    enemyBullets.push({
      x:e.x,y:e.y,
      vx:Math.cos(a+spread*(Math.random()-0.5))*e.bulletSpeed,
      vy:Math.sin(a+spread*(Math.random()-0.5))*e.bulletSpeed,
      r:4,color:e.color,dmg:e.dmg,life:180
    });
  }
}

// ===== DASH =====
function dash(){
  if(P.dashCooldown>0)return;
  P.dashCooldown=60;
  P.dashTimer=8;
  const dx=keys['d']?1:0-(keys['a']?1:0);
  const dy=keys['s']?1:0-(keys['w']?1:0);
  if(dx===0&&dy===0){P.dashDir.x=Math.cos(P.facing);P.dashDir.y=Math.sin(P.facing)}
  else{const l=Math.sqrt(dx*dx+dy*dy);P.dashDir.x=dx/l;P.dashDir.y=dy/l}
  P.invincible=Math.max(P.invincible,10);
  SFX.dash();
  addParticle(P.x,P.y,'#00ccff',10,{speed:3});
}

// ===== ABILITIES =====
function useAbility(idx){
  const a=P.abilities[idx];
  if(a.currentCooldown>0)return;
  a.currentCooldown=a.cooldown;
  
  if(idx===0){//Nova Burst
    SFX.explosion();
    addExplosion(P.x,P.y,'#ff00ff',3);
    for(let e of enemies){
      const dx=e.x-P.x,dy=e.y-P.y;
      if(dx*dx+dy*dy<40000){
        damageEnemy(e,30+P.level*5);
      }
    }
    if(boss){
      const dx=boss.x-P.x,dy=boss.y-P.y;
      if(dx*dx+dy*dy<40000)damageBoss(50+P.level*8);
    }
    screenShake=15;
  } else if(idx===1){//Time Warp
    slowMotion=0.3;
    slowMotionTimer=180;
    SFX.shield();
    P.abilities[1].active=true;
    setTimeout(()=>{P.abilities[1].active=false},3000);
  }
}

// ===== DAMAGE =====
function damageEnemy(e,dmg){
  const crit=Math.random()<0.15;
  const finalDmg=crit?dmg*2:dmg;
  e.hp-=finalDmg;
  totalDamageDealt+=finalDmg;
  addDamageNumber(e.x,e.y-10,finalDmg,crit);
  addParticle(e.x,e.y,e.color,3,{speed:3});
  
  if(crit)SFX.combo();
  
  if(e.hp<=0){
    killEnemy(e);
  }
}

function killEnemy(e){
  const idx=enemies.indexOf(e);
  if(idx>=0)enemies.splice(idx,1);
  
  score+=e.score;
  totalKills++;
  combo++;comboTimer=120;
  if(combo>maxCombo)maxCombo=combo;
  
  addExplosion(e.x,e.y,e.color,e.size/12);
  SFX.explosion();
  
  if(Math.random()<0.25)spawnLoot(e.x,e.y);
  
  // XP
  gainXP(e.score);
  
  screenShake=Math.max(screenShake,3);
}

function damageBoss(dmg){
  if(!boss)return;
  const crit=Math.random()<0.1;
  const finalDmg=crit?dmg*2:dmg;
  boss.hp-=finalDmg;
  totalDamageDealt+=finalDmg;
  addDamageNumber(boss.x,boss.y-30,finalDmg,crit);
  addParticle(boss.x,boss.y,boss.color,5,{speed:4});
  SFX.hit();
  
  const pct=boss.hp/boss.maxHp;
  document.getElementById('bossBarFill').style.width=(pct*100)+'%';
  
  // Phase transitions
  const phaseThreshold=1-(boss.phase+1)/boss.phases;
  if(pct<=phaseThreshold&&boss.phase<boss.phases-1){
    boss.phase++;
    boss.fireRate=Math.max(10,boss.fireRate-10);
    addExplosion(boss.x,boss.y,boss.color,5);
    SFX.bigExplosion();
    screenShake=20;
  }
  
  if(boss.hp<=0){
    killBoss();
  }
}

function killBoss(){
  addExplosion(boss.x,boss.y,boss.color,8);
  SFX.bigExplosion();
  score+=boss.score;
  totalKills++;
  gainXP(boss.score*2);
  
  for(let i=0;i<5;i++)spawnLoot(boss.x+(Math.random()-0.5)*60,boss.y+(Math.random()-0.5)*60);
  
  boss=null;
  bossActive=false;
  document.getElementById('bossHealth').style.display='none';
  screenShake=30;
  showMessage('BOSS DEFEATED!',4000);
}

function damagePlayer(dmg){
  if(P.invincible>0)return;
  if(P.shieldActive){
    P.shield-=dmg;
    SFX.shieldHit();
    addParticle(P.x,P.y,'#00ccff',5,{speed:3});
    if(P.shield<0){P.hp+=P.shield;P.shield=0}
    P.shieldDelay=180;
    return;
  }
  
  P.hp-=dmg;
  totalDamageTaken+=dmg;
  P.shieldDelay=180;
  P.invincible=30;
  damageFlash=0.5;
  screenShake=8;
  SFX.hit();
  addParticle(P.x,P.y,'#ff2244',8,{speed:4});
  
  if(P.hp<=0){
    playerDeath();
  }
}

function playerDeath(){
  state='dead';
  SFX.death();
  addExplosion(P.x,P.y,'#00ccff',5);
  addExplosion(P.x,P.y,'#ff00ff',3);
  
  const statsEl=document.getElementById('finalStats');
  statsEl.innerHTML=`
    <div class="stat-row"><span class="label">Score</span><span class="value">${score}</span></div>
    <div class="stat-row"><span class="label">Wave</span><span class="value">${wave}</span></div>
    <div class="stat-row"><span class="label">Kills</span><span class="value">${totalKills}</span></div>
    <div class="stat-row"><span class="label">Max Combo</span><span class="value">x${maxCombo}</span></div>
    <div class="stat-row"><span class="label">Level</span><span class="value">${P.level}</span></div>
    <div class="stat-row"><span class="label">Damage Dealt</span><span class="value">${Math.round(totalDamageDealt)}</span></div>
  `;
  document.getElementById('screenOverlay2').style.display='flex';
}

// ===== XP & LEVELING =====
function gainXP(amount){
  P.xp+=amount;
  while(P.xp>=P.xpToLevel){
    P.xp-=P.xpToLevel;
    P.level++;
    P.xpToLevel=Math.floor(P.xpToLevel*1.3);
    levelUp();
  }
}

function levelUp(){
  SFX.levelUp();
  P.maxHp+=10;
  P.hp=Math.min(P.hp+20,P.maxHp);
  P.maxShield+=5;
  P.shield=P.maxShield;
  P.speed+=0.1;
  
  // Upgrade random weapon
  const w=P.weapons[Math.floor(Math.random()*P.weapons.length)];
  w.level++;
  w.bulletDmg+=2;
  
  showMessage('LEVEL UP!',2000);
  addParticle(P.x,P.y,'#44ff88',20,{speed:5});
}

// ===== UPDATE =====
function update(){
  if(state!=='playing')return;
  
  gameTime++;
  
  // Slow motion
  if(slowMotionTimer>0){
    slowMotionTimer--;
    if(slowMotionTimer<=0)slowMotion=1;
  }
  const dt=slowMotion;
  
  // Combo timer
  if(comboTimer>0){comboTimer--;if(comboTimer<=0)combo=0}
  
  // Screen shake
  if(screenShake>0){
    screenShakeX=(Math.random()-0.5)*screenShake;
    screenShakeY=(Math.random()-0.5)*screenShake;
    screenShake*=0.9;
    if(screenShake<0.5)screenShake=0;
  }else{screenShakeX=0;screenShakeY=0}
  
  // Damage flash
  if(damageFlash>0)damageFlash-=0.05;
  
  // Mouse world pos
  mouseWorldX=mouseX+camX-canvas.width/2;
  mouseWorldY=mouseY+camY-canvas.height/2;
  P.facing=Math.atan2(mouseWorldY-P.y,mouseWorldX-P.x);
  
  // Player movement
  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])my-=1;
  if(keys['s']||keys['arrowdown'])my+=1;
  if(keys['a']||keys['arrowleft'])mx-=1;
  if(keys['d']||keys['arrowright'])mx+=1;
  if(mx!==0||my!==0){
    const l=Math.sqrt(mx*mx+my*my);mx/=l;my/=l;
  }
  
  // Dash
  if(P.dashTimer>0){
    P.dashTimer--;
    P.x+=P.dashDir.x*P.speed*3*dt;
    P.y+=P.dashDir.y*P.speed*3*dt;
    if(P.dashTimer%2===0)addParticle(P.x,P.y,'#00ccff',1,{speed:1,decay:0.15});
  }else{
    P.x+=mx*P.speed*dt;
    P.y+=my*P.speed*dt;
  }
  
  if(P.dashCooldown>0)P.dashCooldown--;
  if(P.invincible>0)P.invincible--;
  
  // Shield
  if(keys[' ']&&P.shieldCooldown<=0&&P.shield>0){
    P.shieldActive=true;
    P.shieldDuration++;
    if(P.shieldDuration%30===0)SFX.shield();
    P.shield-=0.3;
    if(P.shield<=0){P.shield=0;P.shieldCooldown=120;P.shieldActive=false;P.shieldDuration=0}
  }else{
    P.shieldActive=false;
    P.shieldDuration=0;
    if(P.shieldCooldown>0)P.shieldCooldown--;
  }
  
  // Shield regen
  if(P.shieldDelay>0)P.shieldDelay--;
  else if(P.shield<P.maxShield)P.shield=Math.min(P.maxShield,P.shield+P.shieldRegen*dt);
  
  // Shooting
  for(let w of P.weapons)if(w.cooldown>0)w.cooldown-=dt;
  if(mouseDown)shoot();
  
  // Abilities cooldown
  for(let a of P.abilities)if(a.currentCooldown>0)a.currentCooldown-=dt;
  
  // Camera
  camX+=(P.x-camX)*0.1;
  camY+=(P.y-camY)*0.1;
  
  // Wave system
  waveTimer+=dt;
  if(waveDelay>0){
    waveDelay-=dt;
    if(waveDelay<=0){
      showWaveIndicator();
      // Boss every 5 waves
      if(wave%5===0)spawnBoss();
    }
  } else {
    const spawnInterval=Math.max(15,60-wave*2);
    spawnTimer+=dt;
    if(spawnTimer>=spawnInterval){
      spawnTimer=0;
      const count=Math.min(3+Math.floor(wave/2),10);
      for(let i=0;i<count;i++)spawnEnemy();
    }
    
    // Check wave complete
    if(enemies.length===0&&!bossActive&&waveTimer>120){
      wave++;
      waveTimer=0;
      waveDelay=180;
      showMessage(`Wave ${wave} incoming...`,2000);
    }
  }
  
  // Update bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0){bullets.splice(i,1);continue}
    
    // Trail
    if(gameTime%2===0)addParticle(b.x,b.y,b.color,1,{speed:0.5,size:b.size*0.6,decay:0.1});
    
    // Hit enemies
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      const dx=b.x-e.x,dy=b.y-e.y;
      if(dx*dx+dy*dy<(b.size+e.size)*(b.size+e.size)){
        damageEnemy(e,b.dmg);
        if(b.piercing>0){b.piercing--}
        else{bullets.splice(i,1);break}
      }
    }
    
    // Hit boss
    if(boss&&boss.active){
      const dx=b.x-boss.x,dy=b.y-boss.y;
      if(dx*dx+dy*dy<(b.size+boss.size)*(b.size+boss.size)){
        damageBoss(b.dmg);
        if(b.piercing>0){b.piercing--}
        else{bullets.splice(i,1)}
      }
    }
  }
  
  // Update enemy bullets
  for(let i=enemyBullets.length-1;i>=0;i--){
    const b=enemyBullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0){enemyBullets.splice(i,1);continue}
    
    // Hit player
    const dx=b.x-P.x,dy=b.y-P.y;
    if(dx*dx+dy*dy<(b.r+P.r)*(b.r+P.r)){
      damagePlayer(b.dmg);
      enemyBullets.splice(i,1);
    }
  }
  
  // Update enemies
  for(let e of enemies){
    e.spawnTime+=dt;
    const dx=P.x-e.x,dy=P.y-e.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const a=Math.atan2(dy,dx);
    
    switch(e.behavior){
      case 'chase':
        if(dist>150){
          e.x+=Math.cos(a)*e.speed*dt;
          e.y+=Math.sin(a)*e.speed*dt;
        }
        break;
      case 'strafe':
        e.x+=Math.cos(a)*e.speed*0.5*dt;
        e.y+=Math.sin(a)*e.speed*0.5*dt;
        e.angle+=0.02*e.strafeDir*dt;
        e.x+=Math.cos(e.angle+Math.PI/2)*e.speed*1.5*dt;
        e.y+=Math.sin(e.angle+Math.PI/2)*e.speed*1.5*dt;
        break;
      case 'keepDistance':
        if(dist<250){e.x-=Math.cos(a)*e.speed*dt;e.y-=Math.sin(a)*e.speed*dt}
        else if(dist>400){e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt}
        e.x+=Math.cos(gameTime*0.02)*e.speed*0.5*dt;
        e.y+=Math.sin(gameTime*0.02)*e.speed*0.5*dt;
        break;
      case 'swarm':
        e.angle=(e.angle||0)+0.05*dt;
        e.x+=Math.cos(a)*e.speed*1.2*dt+Math.cos(e.angle)*dt;
        e.y+=Math.sin(a)*e.speed*1.2*dt+Math.sin(e.angle)*dt;
        break;
    }
    
    // Contact damage
    if(dist<e.size+P.r){
      damagePlayer(e.dmg*0.1);
    }
    
    // Shooting
    enemyShoot(e);
    
    // Engine trail
    if(gameTime%3===0)addParticle(e.x-Math.cos(a)*e.size,e.y-Math.sin(a)*e.size,e.color,1,{speed:1,size:2,decay:0.08});
  }
  
  // Update boss
  if(boss){
    boss.moveTimer+=dt;
    if(boss.moveTimer>120){
      boss.moveTimer=0;
      boss.targetX=P.x+(Math.random()-0.5)*400;
      boss.targetY=P.y+(Math.random()-0.5)*400;
    }
    const bdx=boss.targetX-boss.x,bdy=boss.targetY-boss.y;
    const bd=Math.sqrt(bdx*bdx+bdy*bdy);
    if(bd>10){
      boss.x+=(bdx/bd)*boss.speed*dt;
      boss.y+=(bdy/bd)*boss.speed*dt;
    }
    enemyShoot(boss);
    
    // Contact
    const dx=P.x-boss.x,dy=P.y-boss.y;
    if(dx*dx+dy*dy<(boss.size+P.r)*(boss.size+P.r)){
      damagePlayer(boss.dmg*0.2);
    }
    
    // Boss particles
    if(gameTime%5===0)addParticle(boss.x+(Math.random()-0.5)*boss.size,boss.y+(Math.random()-0.5)*boss.size,boss.color,1,{speed:1,decay:0.05});
  }
  
  // Update particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;p.life-=p.decay*dt;
    if(p.life<=0)particles.splice(i,1);
  }
  
  // Update pickups
  for(let i=pickups.length-1;i>=0;i--){
    const pk=pickups[i];
    pk.age+=dt;
    // Magnet
    const dx=P.x-pk.x,dy=P.y-pk.y;
    const dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<150){
      pk.x+=(dx/dist)*5*dt;pk.y+=(dy/dist)*5*dt;
    }
    if(dist<25){
      collectPickup(pk);
      pickups.splice(i,1);
      continue;
    }
    if(pk.age>pk.life)pickups.splice(i,1);
  }
  
  // Update damage numbers
  for(let i=damageNumbers.length-1;i>=0;i--){
    const d=damageNumbers[i];
    d.y+=d.vy*dt;d.life-=0.02*dt;
    if(d.life<=0)damageNumbers.splice(i,1);
  }
  
  // Update UI
  updateUI();
}

// ===== COLLECT PICKUP =====
function collectPickup(pk){
  SFX.pickup();
  switch(pk.type.effect){
    case 'hp':P.hp=Math.min(P.maxHp,P.hp+15);showMessage('+15 HP',1000);break;
    case 'shield':P.shield=Math.min(P.maxShield,P.shield+20);showMessage('+20 Shield',1000);break;
    case 'xp':gainXP(25);showMessage('+25 XP',1000);break;
    case 'weapon':
      const w=P.weapons[Math.floor(Math.random()*P.weapons.length)];
      w.level++;w.bulletDmg+=3;
      showMessage(`${w.name} upgraded!`,1500);
      SFX.powerup();
      break;
    case 'power':
      P.maxHp+=5;P.hp+=5;P.speed+=0.05;
      showMessage('Power Up!',1500);
      SFX.powerup();
      break;
  }
  addParticle(pk.x,pk.y,pk.type.color,8,{speed:3});
}

// ===== DRAW =====
function draw(){
  ctx.save();
  
  // Clear
  ctx.fillStyle='#020208';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  
  // Camera transform
  ctx.translate(canvas.width/2-(camX+screenShakeX),canvas.height/2-(camY+screenShakeY));
  
  // Nebulas
  for(let n of nebulas){
    const gx=n.x-camX+canvas.width/2;
    const gy=n.y-camY+canvas.height/2;
    const grad=ctx.createRadialGradient(gx,gy,0,gx,gy,n.r);
    grad.addColorStop(0,n.color);
    grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad;
    ctx.fillRect(gx-n.r,gy-n.r,n.r*2,n.r*2);
  }
  
  // Stars (parallax)
  for(let s of stars){
    const sx=((s.x-camX*0.3)%canvas.width+canvas.width)%canvas.width;
    const sy=((s.y-camY*0.3)%canvas.height+canvas.height)%canvas.height;
    ctx.globalAlpha=s.brightness*(0.5+0.5*Math.sin(gameTime*0.02+s.z));
    ctx.fillStyle=s.color;
    ctx.beginPath();
    ctx.arc(sx,sy,s.size/s.z,0,Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha=1;
  
  // Pickups
  for(let pk of pickups){
    const pulse=1+0.2*Math.sin(gameTime*0.1);
    ctx.shadowBlur=15;
    ctx.shadowColor=pk.type.color;
    ctx.fillStyle=pk.type.color;
    ctx.beginPath();
    ctx.arc(pk.x,pk.y,pk.r*pulse,0,Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#fff';
    ctx.font='12px Arial';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(pk.type.icon,pk.x,pk.y);
  }
  
  // Enemy bullets
  for(let b of enemyBullets){
    ctx.shadowBlur=10;
    ctx.shadowColor=b.color;
    ctx.fillStyle=b.color;
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fill();
    // Glow
    ctx.globalAlpha=0.3;
    ctx.beginPath();
    ctx.arc(b.x,b.y,b.r*2,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
    ctx.shadowBlur=0;
  }
  
  // Player bullets
  for(let b of bullets){
    ctx.shadowBlur=8;
    ctx.shadowColor=b.color;
    if(b.type==='heavy'){
      ctx.fillStyle=b.color;
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.size,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=0.4;
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.size*1.5,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=1;
    } else if(b.type==='plasma'){
      ctx.fillStyle='#fff';
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.size*0.5,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle=b.color;
      ctx.globalAlpha=0.6;
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.size,0,Math.PI*2);
      ctx.fill();
      ctx.globalAlpha=1;
    } else {
      ctx.fillStyle=b.color;
      ctx.beginPath();
      ctx.arc(b.x,b.y,b.size,0,Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur=0;
  }
  
  // Enemies
  for(let e of enemies){
    ctx.save();
    ctx.translate(e.x,e.y);
    
    // Glow
    ctx.shadowBlur=15;
    ctx.shadowColor=e.color;
    
    // Body
    ctx.fillStyle=e.color;
    if(e.behavior==='tank'){
      ctx.beginPath();
      for(let i=0;i<6;i++){
        const a=i*Math.PI/3;
        const r=e.size*(i%2===0?1:0.7);
        if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
        else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
      }
      ctx.closePath();
      ctx.fill();
    } else if(e.behavior==='swarm'){
      ctx.beginPath();
      ctx.moveTo(e.size,0);
      ctx.lineTo(-e.size*0.5,-e.size*0.7);
      ctx.lineTo(-e.size*0.3,0);
      ctx.lineTo(-e.size*0.5,e.size*0.7);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(0,0,e.size,0,Math.PI*2);
      ctx.fill();
    }
    
    // Inner
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.arc(0,0,e.size*0.5,0,Math.PI*2);
    ctx.fill();
    
    // Health bar
    if(e.hp<e.maxHp){
      const barW=e.size*2;
      ctx.fillStyle='rgba(255,0,0,0.5)';
      ctx.fillRect(-barW/2,-e.size-8,barW,3);
      ctx.fillStyle='#ff4444';
      ctx.fillRect(-barW/2,-e.size-8,barW*(e.hp/e.maxHp),3);
    }
    
    ctx.shadowBlur=0;
    ctx.restore();
  }
  
  // Boss
  if(boss){
    ctx.save();
    ctx.translate(boss.x,boss.y);
    
    // Aura
    const auraSize=boss.size*(1.5+0.3*Math.sin(gameTime*0.05));
    const aura=ctx.createRadialGradient(0,0,0,0,0,auraSize);
    aura.addColorStop(0,boss.color+'44');
    aura.addColorStop(1,'transparent');
    ctx.fillStyle=aura;
    ctx.beginPath();
    ctx.arc(0,0,auraSize,0,Math.PI*2);
    ctx.fill();
    
    ctx.shadowBlur=30;
    ctx.shadowColor=boss.color;
    
    // Body
    ctx.fillStyle=boss.color;
    ctx.beginPath();
    for(let i=0;i<8;i++){
      const a=i*Math.PI/4+gameTime*0.01;
      const r=boss.size*(i%2===0?1:0.6);
      if(i===0)ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);
      else ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    }
    ctx.closePath();
    ctx.fill();
    
    // Core
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.arc(0,0,boss.size*0.3,0,Math.PI*2);
    ctx.fill();
    
    // Eye
    ctx.fillStyle='#000';
    ctx.beginPath();
    ctx.arc(Math.cos(gameTime*0.02)*5,Math.sin(gameTime*0.02)*5,boss.size*0.12,0,Math.PI*2);
    ctx.fill();
    
    ctx.shadowBlur=0;
    ctx.restore();
  }
  
  // Player
  if(state==='playing'){
    ctx.save();
    ctx.translate(P.x,P.y);
    
    // Shield visual
    if(P.shieldActive){
      ctx.strokeStyle='rgba(0,200,255,0.6)';
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.arc(0,0,P.r+8,0,Math.PI*2);
      ctx.stroke();
      ctx.fillStyle='rgba(0,200,255,0.1)';
      ctx.fill();
    }
    
    // Invincibility flash
    if(P.invincible>0&&Math.floor(P.invincible/3)%2===0){
      ctx.globalAlpha=0.5;
    }
    
    // Engine glow
    const engineGlow=ctx.createRadialGradient(-Math.cos(P.facing)*10,-Math.sin(P.facing)*10,0,-Math.cos(P.facing)*10,-Math.sin(P.facing)*10,20);
    engineGlow.addColorStop(0,'rgba(0,200,255,0.5)');
    engineGlow.addColorStop(1,'transparent');
    ctx.fillStyle=engineGlow;
    ctx.beginPath();
    ctx.arc(-Math.cos(P.facing)*10,-Math.sin(P.facing)*10,20,0,Math.PI*2);
    ctx.fill();
    
    // Ship body
    ctx.shadowBlur=20;
    ctx.shadowColor='#00ccff';
    ctx.rotate(P.facing);
    
    // Main body
    const shipGrad=ctx.createLinearGradient(-15,0,20,0);
    shipGrad.addColorStop(0,'#004466');
    shipGrad.addColorStop(0.5,'#00ccff');
    shipGrad.addColorStop(1,'#004466');
    ctx.fillStyle=shipGrad;
    
    ctx.beginPath();
    ctx.moveTo(20,0);
    ctx.lineTo(-12,-10);
    ctx.lineTo(-8,0);
    ctx.lineTo(-12,10);
    ctx.closePath();
    ctx.fill();
    
    // Cockpit
    ctx.fillStyle='#66eeff';
    ctx.beginPath();
    ctx.ellipse(5,0,6,3,0,0,Math.PI*2);
    ctx.fill();
    
    // Wings
    ctx.fillStyle='#0088aa';
    ctx.beginPath();
    ctx.moveTo(-5,-5);
    ctx.lineTo(-15,-14);
    ctx.lineTo(-8,-3);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-5,5);
    ctx.lineTo(-15,14);
    ctx.lineTo(-8,3);
    ctx.closePath();
    ctx.fill();
    
    ctx.shadowBlur=0;
    ctx.globalAlpha=1;
    ctx.restore();
  }
  
  // Particles
  for(let p of particles){
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    if(p.type==='circle'){
      ctx.beginPath();
      ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);
      ctx.fill();
    } else {
      ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
    }
  }
  ctx.globalAlpha=1;
  
  // Damage numbers
  for(let d of damageNumbers){
    ctx.globalAlpha=d.life;
    ctx.fillStyle=d.color;
    ctx.font=`bold ${d.size}px 'Segoe UI'`;
    ctx.textAlign='center';
    ctx.fillText(d.text,d.x,d.y);
  }
  ctx.globalAlpha=1;
  
  ctx.restore();
  
  // Damage flash overlay
  if(damageFlash>0){
    ctx.globalAlpha=damageFlash;
    ctx.fillStyle='rgba(255,0,0,0.3)';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalAlpha=1;
  }
  
  // Slow motion tint
  if(slowMotion<1){
    ctx.globalAlpha=0.15;
    ctx.fillStyle='#0044aa';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.globalAlpha=1;
  }
  
  // Minimap
  drawMinimap();
}

// ===== MINIMAP =====
function drawMinimap(){
  mmCtx.fillStyle='rgba(0,0,0,0.7)';
  mmCtx.fillRect(0,0,100,100);
  
  const scale=0.05;
  const cx=50-(P.x-camX)*scale;
  const cy=50-(P.y-camY)*scale;
  
  // Enemies
  mmCtx.fillStyle='#ff4444';
  for(let e of enemies){
    mmCtx.fillRect(e.x*scale+cx-1,e.y*scale+cy-1,2,2);
  }
  
  // Boss
  if(boss){
    mmCtx.fillStyle='#ff00ff';
    mmCtx.beginPath();
    mmCtx.arc(boss.x*scale+cx,boss.y*scale+cy,3,0,Math.PI*2);
    mmCtx.fill();
  }
  
  // Player
  mmCtx.fillStyle='#00ccff';
  mmCtx.beginPath();
  mmCtx.arc(50,50,2,0,Math.PI*2);
  mmCtx.fill();
  
  // Border
  mmCtx.strokeStyle='rgba(255,255,255,0.15)';
  mmCtx.lineWidth=1;
  mmCtx.strokeRect(0,0,100,100);
}

// ===== UI UPDATES =====
function updateUI(){
  document.getElementById('healthBar').style.width=(P.hp/P.maxHp*100)+'%';
  document.getElementById('shieldBar').style.width=(P.shield/P.maxShield*100)+'%';
  document.getElementById('expFill').style.width=(P.xp/P.xpToLevel*100)+'%';
  document.getElementById('scoreDisplay').textContent=score.toLocaleString();
  document.getElementById('waveDisplay').textContent=wave;
  document.getElementById('levelBadge').textContent='LEVEL '+P.level;
  
  const mins=Math.floor(gameTime/3600);
  const secs=Math.floor((gameTime%3600)/60);
  document.getElementById('timeDisplay').textContent=`${mins}:${secs.toString().padStart(2,'0')}`;
  
  const cc=document.getElementById('comboCount');
  if(combo>1){cc.textContent='x'+combo;cc.style.opacity=1}
  else{cc.style.opacity=0}
}

function updateWeaponUI(){
  const wb=document.getElementById('weaponBar');
  wb.innerHTML='';
  P.weapons.forEach((w,i)=>{
    const div=document.createElement('div');
    div.className='weapon-slot'+(i===P.currentWeapon?' active':'');
    div.style.borderColor=i===P.currentWeapon?w.color:'rgba(255,255,255,0.15)';
    div.innerHTML=`<span style="color:${w.color};font-size:14px">${w.name[0]}</span><span class="slot-key">${w.key}</span>`;
    wb.appendChild(div);
  });
  
  const ab=document.getElementById('abilityBar');
  ab.innerHTML='';
  P.abilities.forEach((a,i)=>{
    const div=document.createElement('div');
    div.className='ability-slot';
    div.innerHTML=`<span style="font-size:18px">${a.icon}</span><span class="ability-key">${a.key}</span>`;
    if(a.currentCooldown>0){
      const pct=a.currentCooldown/a.cooldown;
      div.innerHTML+=`<div class="cooldown-overlay" style="height:${pct*100}%"></div>`;
    }
    ab.appendChild(div);
  });
}

// ===== MESSAGES =====
let messages=[];
function showMessage(text,duration=2000){
  const el=document.createElement('div');
  el.className='message';
  el.textContent=text;
  document.getElementById('messageArea').appendChild(el);
  setTimeout(()=>{el.style.opacity=1;el.style.transform='translateY(-10px)'},10);
  setTimeout(()=>{
    el.style.opacity=0;
    setTimeout(()=>el.remove(),300);
  },duration);
}

function showBossWarning(name){
  const el=document.getElementById('bossWarning');
  document.getElementById('bossName').textContent=name;
  el.style.opacity=1;
  setTimeout(()=>{el.style.opacity=0},3000);
}

function showWaveIndicator(){
  const el=document.getElementById('waveIndicator');
  document.getElementById('waveText').textContent='WAVE '+wave;
  el.style.opacity=1;
  setTimeout(()=>{el.style.opacity=0},2000);
}

// ===== GAME LOOP =====
function gameLoop(){
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// ===== START GAME =====
function startGame(){
  initAudio();
  state='playing';
  score=0;wave=1;waveTimer=0;waveDelay=0;gameTime=0;
  combo=0;comboTimer=0;maxCombo=0;
  totalKills=0;totalDamageDealt=0;totalDamageTaken=0;
  bossActive=false;boss=null;
  screenShake=0;damageFlash=0;slowMotion=1;slowMotionTimer=0;
  
  P.x=0;P.y=0;
  P.hp=P.maxHp=100;P.shield=P.maxShield=50;
  P.speed=4;P.xp=0;P.xpToLevel=100;P.level=1;
  P.invincible=60;P.dashCooldown=0;P.dashTimer=0;
  P.shieldCooldown=0;P.shieldActive=false;P.shieldDuration=0;
  P.shieldDelay=0;
  
  P.weapons=WEAPON_DEFS.map(w=>({...w,cooldown:0,level:1}));
  P.currentWeapon=0;
  P.abilities=ABILITY_DEFS.map(a=>({...a,currentCooldown:0,active:false}));
  
  bullets=[];enemyBullets=[];enemies=[];particles=[];pickups=[];damageNumbers=[];
  
  initStars();
  updateWeaponUI();
  updateUI();
  
  document.getElementById('screenOverlay').classList.add('hidden');
  document.getElementById('screenOverlay2').style.display='none';
  document.getElementById('bossHealth').style.display='none';
  
  showMessage('Wave 1 - Survive!',2000);
}

// ===== EVENT LISTENERS =====
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('retryBtn').addEventListener('click',startGame);

// ===== INIT =====
initStars();
updateWeaponUI();
gameLoop();
  </script>
