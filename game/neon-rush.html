<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Rush</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .game-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 500px;
            padding: 15px 25px;
            background: linear-gradient(180deg, rgba(20, 20, 35, 0.95), rgba(10, 10, 20, 0.9));
            border-radius: 15px 15px 0 0;
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-bottom: none;
        }

        .header h1 {
            font-size: 1.5rem;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #ffff00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 3px;
            animation: titleGlow 2s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .stats {
            display: flex;
            gap: 20px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .stat-value.score {
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .stat-value.multiplier {
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }

        .stat-value.orbs {
            color: #ffff00;
            text-shadow: 0 0 10px rgba(255, 255, 0, 0.5);
        }

        #gameCanvas {
            display: block;
            border-left: 1px solid rgba(0, 255, 255, 0.2);
            border-right: 1px solid rgba(0, 255, 255, 0.2);
            background: #08081a;
        }

        .footer {
            width: 500px;
            padding: 12px 20px;
            background: linear-gradient(0deg, rgba(20, 20, 35, 0.95), rgba(10, 10, 20, 0.9));
            border-radius: 0 0 15px 15px;
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-top: none;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            padding: 10px 25px;
            font-size: 0.85rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00ffff, #0088ff);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }

        .btn-secondary {
            background: transparent;
            border: 2px solid rgba(255, 0, 255, 0.5);
            color: #ff00ff;
        }

        .btn-secondary:hover {
            background: rgba(255, 0, 255, 0.1);
            border-color: #ff00ff;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(8px);
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 5px;
            background: linear-gradient(90deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .overlay .subtitle {
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 20px;
            font-size: 1rem;
            letter-spacing: 2px;
        }

        .overlay .final-score {
            font-size: 2.5rem;
            color: #00ffff;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
        }

        .overlay .high-score {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 25px;
        }

        .overlay .result-grid {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }

        .overlay .result-item {
            text-align: center;
        }

        .overlay .result-item .label {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .overlay .result-item .value {
            font-size: 1.3rem;
            font-weight: bold;
            color: #00ffff;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            font-family: 'Courier New', monospace;
        }

        .overlay .result-item .value.gold {
            color: #ffff00;
            text-shadow: 0 0 15px rgba(255, 255, 0, 0.5);
        }

        .overlay .result-item .value.pink {
            color: #ff00ff;
            text-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
        }

        .instructions {
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.8rem;
            margin-top: 18px;
            text-align: center;
            line-height: 1.8;
        }

        .instructions kbd {
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .powerup-indicator {
            position: absolute;
            top: 70px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 5;
        }

        .powerup-badge {
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
            animation: pulse 1s infinite;
            background: rgba(0, 0, 0, 0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .combo-popup {
            position: absolute;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffff00;
            text-shadow: 0 0 20px rgba(255, 255, 0, 0.8);
            pointer-events: none;
            z-index: 5;
            animation: comboFloat 0.8s ease-out forwards;
        }

        @keyframes comboFloat {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-50px) scale(1.5); }
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <div class="header">
            <h1>NEON RUSH</h1>
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Score</div>
                    <div class="stat-value score" id="score">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Multiplier</div>
                    <div class="stat-value multiplier" id="multiplier">x1</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Orbs</div>
                    <div class="stat-value orbs" id="orbs">0</div>
                </div>
            </div>
        </div>

        <canvas id="gameCanvas" width="500" height="600"></canvas>

        <div class="footer">
            <button class="btn btn-primary" id="startBtn">START</button>
            <button class="btn btn-secondary" id="pauseBtn">PAUSE</button>
        </div>

        <div class="powerup-indicator" id="powerupIndicator"></div>

        <div class="overlay" id="startScreen">
            <h2>NEON RUSH</h2>
            <p class="subtitle">Dodge obstacles. Collect orbs. Survive!</p>
            <button class="btn btn-primary" id="playBtn">PLAY NOW</button>
            <p class="instructions">
                <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> to move<br>
                <kbd>Space</kbd> to dash | <kbd>P</kbd> to pause<br>
                Collect <span style="color: #ffff00">★</span> orbs for points | Avoid <span style="color: #ff0066">◆</span> obstacles
            </p>
        </div>

        <div class="overlay hidden" id="gameOverScreen">
            <h2>GAME OVER</h2>
            <div class="final-score" id="finalScore">0</div>
            <div class="result-grid">
                <div class="result-item">
                    <div class="label">Orbs</div>
                    <div class="value gold" id="finalOrbs">0</div>
                </div>
                <div class="result-item">
                    <div class="label">Max Combo</div>
                    <div class="value pink" id="finalCombo">0</div>
                </div>
                <div class="result-item">
                    <div class="label">Best</div>
                    <div class="value" id="finalHighScore">0</div>
                </div>
            </div>
            <button class="btn btn-primary" id="retryBtn">TRY AGAIN</button>
        </div>

        <div class="overlay hidden" id="pauseScreen">
            <h2 style="background: linear-gradient(90deg, #00ffff, #ff00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;">PAUSED</h2>
            <p class="subtitle">Press P or click Resume to continue</p>
            <button class="btn btn-primary" id="resumeBtn">RESUME</button>
        </div>
    </div>

    <script>
        // Audio Context for sound effects
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            switch(type) {
                case 'collect':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(1100, audioCtx.currentTime + 0.05);
                    oscillator.frequency.setValueAtTime(1320, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.15);
                    break;
                case 'dash':
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(200, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                    gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.1);
                    break;
                case 'hit':
                    oscillator.type = 'square';
                    oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.3);
                    break;
                case 'combo':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(900, audioCtx.currentTime + 0.08);
                    oscillator.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.16);
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.25);
                    break;
                case 'powerup':
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(523, audioCtx.currentTime);
                    oscillator.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
                    oscillator.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
                    oscillator.frequency.setValueAtTime(1047, audioCtx.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.4);
                    break;
                case 'gameover':
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.8);
                    gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.8);
                    break;
            }
        }

        // Game Setup
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game State
        let gameState = 'start'; // start, playing, paused, gameover
        let score = 0;
        let orbsCollected = 0;
        let highScore = 0;
        try {
            highScore = parseInt(localStorage.getItem('neonRushHighScore')) || 0;
        } catch(e) {}
        let multiplier = 1;
        let combo = 0;
        let maxCombo = 0;
        let comboTimer = 0;
        let gameSpeed = 3;
        let lastTime = 0;
        let deltaTime = 0;
        let shakeTimer = 0;
        let shakeIntensity = 0;

        // Player
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 80,
            width: 40,
            height: 40,
            speed: 6,
            dx: 0,
            color: '#00ffff',
            glowColor: 'rgba(0, 255, 255, 0.6)',
            trail: [],
            dashing: false,
            dashCooldown: 0,
            dashDuration: 0,
            invincible: false,
            invincibleTimer: 0,
            shield: false,
            magnet: false,
            slowTime: false
        };

        // Game objects
        let obstacles = [];
        let collectibles = [];
        let powerups = [];
        let particles = [];
        let bgStars = [];

        // Initialize background stars
        for (let i = 0; i < 80; i++) {
            bgStars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 2 + 1,
                brightness: Math.random() * 0.5 + 0.2
            });
        }

        // Input
        let keys = {};

        // Power-up types
        const POWERUP_TYPES = {
            SHIELD: { color: '#00ff88', symbol: '🛡️', desc: 'Shield', duration: 5000 },
            MAGNET: { color: '#ff00ff', symbol: '🧲', desc: 'Magnet', duration: 6000 },
            SLOW: { color: '#ffff00', symbol: '⏱️', desc: 'Slow Time', duration: 4000 },
            DOUBLE: { color: '#ff6600', symbol: '×2', desc: 'Double Points', duration: 5000 }
        };

        let activePowerups = {};

        function spawnObstacle() {
            const types = ['diamond', 'triangle', 'square', 'line'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            const width = type === 'line' ? 80 + Math.random() * 60 : 30 + Math.random() * 20;
            const height = type === 'line' ? 15 : 30 + Math.random() * 20;
            
            obstacles.push({
                x: Math.random() * (canvas.width - width - 40) + 20,
                y: -height - 20,
                width: width,
                height: height,
                speed: gameSpeed + Math.random() * 2,
                type: type,
                color: type === 'line' ? '#ff0066' : ['#ff0066', '#ff6600', '#ff00ff', '#ff0044'][Math.floor(Math.random() * 4)],
                rotation: 0,
                rotationSpeed: (Math.random() - 0.5) * 0.1
            });
        }

        function spawnCollectible() {
            collectibles.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -30,
                radius: 12,
                speed: gameSpeed * 0.8,
                value: 100,
                color: '#ffff00',
                glowColor: 'rgba(255, 255, 0, 0.6)',
                pulse: 0
            });
        }

        function spawnPowerup() {
            const types = Object.keys(POWERUP_TYPES);
            const type = types[Math.floor(Math.random() * types.length)];
            const powerup = POWERUP_TYPES[type];
            
            powerups.push({
                x: Math.random() * (canvas.width - 40) + 20,
                y: -30,
                radius: 15,
                speed: gameSpeed * 0.6,
                type: type,
                color: powerup.color,
                symbol: powerup.symbol,
                pulse: 0
            });
        }

        function createParticles(x, y, color, count, spread = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * spread,
                    dy: (Math.random() - 0.5) * spread,
                    life: 1,
                    decay: 0.02 + Math.random() * 0.02,
                    size: 2 + Math.random() * 4,
                    color: color
                });
            }
        }

        function activatePowerup(type) {
            playSound('powerup');
            
            if (activePowerups[type]) {
                clearTimeout(activePowerups[type]);
            }
            
            const powerup = POWERUP_TYPES[type];
            
            switch(type) {
                case 'SHIELD':
                    player.shield = true;
                    player.invincible = true;
                    activePowerups[type] = setTimeout(() => { 
                        player.shield = false; 
                        player.invincible = false;
                    }, powerup.duration);
                    break;
                case 'MAGNET':
                    player.magnet = true;
                    activePowerups[type] = setTimeout(() => { player.magnet = false; }, powerup.duration);
                    break;
                case 'SLOW':
                    player.slowTime = true;
                    activePowerups[type] = setTimeout(() => { player.slowTime = false; }, powerup.duration);
                    break;
                case 'DOUBLE':
                    multiplier = Math.min(multiplier + 1, 8);
                    activePowerups[type] = setTimeout(() => { 
                        multiplier = Math.max(1, multiplier - 1);
                        updateUI();
                    }, powerup.duration);
                    break;
            }
            
            updatePowerupDisplay();
        }

        function updatePowerupDisplay() {
            const indicator = document.getElementById('powerupIndicator');
            indicator.innerHTML = '';
            
            for (let type in activePowerups) {
                const powerup = POWERUP_TYPES[type];
                const badge = document.createElement('div');
                badge.className = 'powerup-badge';
                badge.style.color = powerup.color;
                badge.style.border = `1px solid ${powerup.color}`;
                badge.textContent = `${powerup.symbol} ${powerup.desc}`;
                indicator.appendChild(badge);
            }
        }

        function dash() {
            if (player.dashCooldown > 0 || player.dashing) return;
            
            player.dashing = true;
            player.dashDuration = 15;
            player.dashCooldown = 60;
            player.invincible = true;
            playSound('dash');
            
            // Create dash trail
            for (let i = 0; i < 10; i++) {
                createParticles(player.x, player.y + player.height / 2, player.color, 3, 4);
            }
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function checkCircleCollision(circle, rect) {
            const distX = Math.abs(circle.x - rect.x - rect.width / 2);
            const distY = Math.abs(circle.y - rect.y - rect.height / 2);
            
            if (distX > (rect.width / 2 + circle.radius)) return false;
            if (distY > (rect.height / 2 + circle.radius)) return false;
            
            return true;
        }

        function showComboPopup(x, y, text) {
            const popup = document.createElement('div');
            popup.className = 'combo-popup';
            popup.textContent = text;
            popup.style.left = x + 'px';
            popup.style.top = y + 'px';
            document.querySelector('.game-wrapper').appendChild(popup);
            setTimeout(() => popup.remove(), 800);
        }

        function update(dt) {
            if (gameState !== 'playing') return;

            const timeScale = player.slowTime ? 0.5 : 1;

            // Update combo timer
            if (comboTimer > 0) {
                comboTimer -= dt * 60;
                if (comboTimer <= 0) {
                    combo = 0;
                    updateUI();
                }
            }

            // Update powerup timers
            for (let type in activePowerups) {
                // Timers are handled by setTimeout, just update display
            }

            // Update invincibility
            if (player.invincibleTimer > 0) {
                player.invincibleTimer -= dt * 1000;
                if (player.invincibleTimer <= 0 && !player.shield) {
                    player.invincible = false;
                }
            }

            // Update shake
            if (shakeTimer > 0) shakeTimer -= dt * 60;

            // Player movement
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.dx = -player.speed;
            } else if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.dx = player.speed;
            } else {
                player.dx *= 0.85;
            }

            // Dashing
            if (player.dashing) {
                player.dashDuration -= dt * 60;
                player.dx *= 1.1;
                if (player.dashDuration <= 0) {
                    player.dashing = false;
                    if (!player.shield) {
                        player.invincible = false;
                    }
                }
            }

            if (player.dashCooldown > 0) {
                player.dashCooldown -= dt * 60;
            }

            player.x += player.dx * dt * 60;
            player.x = Math.max(player.width / 2, Math.min(canvas.width - player.width / 2, player.x));

            // Update trail
            player.trail.push({ x: player.x, y: player.y, alpha: 1 });
            if (player.trail.length > 15) player.trail.shift();
            player.trail.forEach(t => t.alpha -= 0.07 * dt * 60);

            // Spawn objects
            const spawnRate = Math.max(0.02, 0.06 - (gameSpeed - 3) * 0.005);
            if (Math.random() < spawnRate * dt * 60) {
                spawnObstacle();
            }
            if (Math.random() < (spawnRate * 0.8) * dt * 60) {
                spawnCollectible();
            }
            if (Math.random() < 0.003 * dt * 60) {
                spawnPowerup();
            }

            // Update obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.y += obs.speed * timeScale * dt * 60;
                obs.rotation += obs.rotationSpeed * dt * 60;

                // Check collision with player
                if (!player.invincible && !player.dashing) {
                    const playerRect = {
                        x: player.x - player.width / 2 + 8,
                        y: player.y - player.height / 2 + 8,
                        width: player.width - 16,
                        height: player.height - 16
                    };
                    
                    if (checkCollision(playerRect, obs)) {
                        if (player.shield) {
                            player.shield = false;
                            player.invincible = false;
                            createParticles(obs.x + obs.width / 2, obs.y + obs.height / 2, '#00ff88', 20);
                            obstacles.splice(i, 1);
                            playSound('hit');
                            shakeTimer = 10;
                            shakeIntensity = 8;
                        } else {
                            gameOver();
                            return;
                        }
                        continue;
                    }
                }

                // Remove off-screen obstacles
                if (obs.y > canvas.height + 50) {
                    obstacles.splice(i, 1);
                }
            }

            // Update collectibles
            for (let i = collectibles.length - 1; i >= 0; i--) {
                const col = collectibles[i];
                
                // Magnet effect
                if (player.magnet) {
                    const dx = player.x - col.x;
                    const dy = player.y - col.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 200) {
                        col.x += (dx / dist) * 5 * dt * 60;
                        col.y += (dy / dist) * 5 * dt * 60;
                    } else {
                        col.y += col.speed * timeScale * dt * 60;
                    }
                } else {
                    col.y += col.speed * timeScale * dt * 60;
                }
                
                col.pulse += 0.1 * dt * 60;

                // Check collection
                const dist = Math.sqrt(
                    Math.pow(player.x - col.x, 2) + 
                    Math.pow(player.y - col.y, 2)
                );
                
                if (dist < col.radius + player.width / 2) {
                    combo++;
                    comboTimer = 120;
                    maxCombo = Math.max(maxCombo, combo);
                    orbsCollected++;
                    
                    const points = col.value * multiplier * (1 + combo * 0.1);
                    score += Math.floor(points);
                    
                    if (combo > 1 && combo % 5 === 0) {
                        playSound('combo');
                        showComboPopup(col.x, col.y, `${combo} COMBO!`);
                    } else {
                        playSound('collect');
                    }
                    
                    createParticles(col.x, col.y, col.color, 15);
                    collectibles.splice(i, 1);
                    updateUI();
                    continue;
                }

                // Remove off-screen collectibles
                if (col.y > canvas.height + 30) {
                    collectibles.splice(i, 1);
                    combo = 0;
                    updateUI();
                }
            }

            // Update powerups
            for (let i = powerups.length - 1; i >= 0; i--) {
                const pup = powerups[i];
                pup.y += pup.speed * timeScale * dt * 60;
                pup.pulse += 0.08 * dt * 60;

                // Check collection
                const dist = Math.sqrt(
                    Math.pow(player.x - pup.x, 2) + 
                    Math.pow(player.y - pup.y, 2)
                );
                
                if (dist < pup.radius + player.width / 2) {
                    activatePowerup(pup.type);
                    createParticles(pup.x, pup.y, pup.color, 25);
                    powerups.splice(i, 1);
                    continue;
                }

                // Remove off-screen powerups
                if (pup.y > canvas.height + 30) {
                    powerups.splice(i, 1);
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.dx * dt * 60;
                p.y += p.dy * dt * 60;
                p.dy += 0.1 * dt * 60;
                p.life -= p.decay * dt * 60;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Update background stars
            for (let star of bgStars) {
                star.y += star.speed * gameSpeed * 0.5 * timeScale * dt * 60;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            }

            // Increase difficulty over time
            gameSpeed = 3 + Math.floor(score / 1000) * 0.5;
            gameSpeed = Math.min(gameSpeed, 12);
        }

        function draw() {
            // Screen shake
            ctx.save();
            if (shakeTimer > 0) {
                ctx.translate(
                    (Math.random() - 0.5) * shakeIntensity * 2,
                    (Math.random() - 0.5) * shakeIntensity * 2
                );
            }

            // Background
            ctx.fillStyle = '#08081a';
            ctx.fillRect(-10, -10, canvas.width + 20, canvas.height + 20);

            // Grid lines (moving)
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridOffset = (Date.now() * 0.05 * gameSpeed) % 40;
            for (let y = -40 + gridOffset; y < canvas.height + 40; y += 40) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            for (let x = 0; x < canvas.width; x += 40) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }

            // Background stars
            for (let star of bgStars) {
                ctx.globalAlpha = star.brightness;
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;

            // Draw obstacles
            for (let obs of obstacles) {
                ctx.save();
                ctx.translate(obs.x + obs.width / 2, obs.y + obs.height / 2);
                ctx.rotate(obs.rotation);
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = obs.color;
                ctx.fillStyle = obs.color;
                
                switch(obs.type) {
                    case 'diamond':
                        ctx.beginPath();
                        ctx.moveTo(0, -obs.height / 2);
                        ctx.lineTo(obs.width / 2, 0);
                        ctx.lineTo(0, obs.height / 2);
                        ctx.lineTo(-obs.width / 2, 0);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        break;
                    case 'triangle':
                        ctx.beginPath();
                        ctx.moveTo(0, -obs.height / 2);
                        ctx.lineTo(obs.width / 2, obs.height / 2);
                        ctx.lineTo(-obs.width / 2, obs.height / 2);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                        break;
                    case 'square':
                        ctx.fillRect(-obs.width / 2, -obs.height / 2, obs.width, obs.height);
                        ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(-obs.width / 2, -obs.height / 2, obs.width, obs.height);
                        break;
                    case 'line':
                        ctx.fillRect(-obs.width / 2, -obs.height / 2, obs.width, obs.height);
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                        ctx.fillRect(-obs.width / 2 + 2, -obs.height / 2 + 2, obs.width - 4, obs.height - 4);
                        break;
                }
                
                ctx.shadowBlur = 0;
                ctx.restore();
            }

            // Draw collectibles
            for (let col of collectibles) {
                const pulseScale = 1 + Math.sin(col.pulse) * 0.15;
                
                ctx.save();
                ctx.translate(col.x, col.y);
                ctx.scale(pulseScale, pulseScale);
                
                ctx.shadowBlur = 20;
                ctx.shadowColor = col.glowColor;
                
                // Outer glow
                const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, col.radius * 1.5);
                gradient.addColorStop(0, col.color);
                gradient.addColorStop(0.5, 'rgba(255, 255, 0, 0.3)');
                gradient.addColorStop(1, 'rgba(255, 255, 0, 0)');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(0, 0, col.radius * 1.5, 0, Math.PI * 2);
                ctx.fill();
                
                // Star shape
                ctx.fillStyle = col.color;
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i * 4 * Math.PI / 5) - Math.PI / 2;
                    const x = Math.cos(angle) * col.radius;
                    const y = Math.sin(angle) * col.radius;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.restore();
            }

            // Draw powerups
            for (let pup of powerups) {
                const pulseScale = 1 + Math.sin(pup.pulse) * 0.2;
                
                ctx.save();
                ctx.translate(pup.x, pup.y);
                ctx.scale(pulseScale, pulseScale);
                
                ctx.shadowBlur = 25;
                ctx.shadowColor = pup.color;
                
                // Outer ring
                ctx.strokeStyle = pup.color;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, pup.radius, 0, Math.PI * 2);
                ctx.stroke();
                
                // Inner fill
                ctx.fillStyle = pup.color + '40';
                ctx.beginPath();
                ctx.arc(0, 0, pup.radius - 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Symbol
                ctx.fillStyle = pup.color;
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(pup.symbol, 0, 0);
                
                ctx.shadowBlur = 0;
                ctx.restore();
            }

            // Draw player trail
            for (let i = 0; i < player.trail.length; i++) {
                const t = player.trail[i];
                if (t.alpha <= 0) continue;
                
                ctx.globalAlpha = t.alpha * 0.5;
                ctx.fillStyle = player.dashing ? '#ffffff' : player.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = player.glowColor;
                ctx.beginPath();
                ctx.arc(t.x, t.y, player.width / 2 * t.alpha, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // Draw player
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // Shield effect
            if (player.shield) {
                ctx.strokeStyle = '#00ff88';
                ctx.lineWidth = 3;
                ctx.shadowBlur = 20;
                ctx.shadowColor = '#00ff88';
                ctx.beginPath();
                ctx.arc(0, 0, player.width / 2 + 10, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            // Invincibility flash
            if (player.invincible && !player.shield && Math.floor(Date.now() / 100) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }
            
            ctx.shadowBlur = 25;
            ctx.shadowColor = player.dashing ? '#ffffff' : player.glowColor;
            
            // Player body (hexagon)
            const gradient = ctx.createRadialGradient(0, 0, 0, 0, 0, player.width / 2);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(0.3, player.color);
            gradient.addColorStop(1, player.dashing ? '#ffffff' : adjustColor(player.color, -30));
            ctx.fillStyle = gradient;
            
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (i * Math.PI / 3) - Math.PI / 2;
                const x = Math.cos(angle) * player.width / 2;
                const y = Math.sin(angle) * player.height / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            
            // Inner detail
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (i * Math.PI / 3) - Math.PI / 2;
                const x = Math.cos(angle) * player.width / 4;
                const y = Math.sin(angle) * player.height / 4;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();
            ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.restore();

            // Draw particles
            for (let p of particles) {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            // Dash cooldown indicator
            if (player.dashCooldown > 0) {
                const cooldownPercent = player.dashCooldown / 60;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
                ctx.fillRect(20, canvas.height - 30, 60, 8);
                ctx.fillStyle = '#00ffff';
                ctx.fillRect(20, canvas.height - 30, 60 * (1 - cooldownPercent), 8);
                ctx.strokeStyle = 'rgba(0, 255, 255, 0.3)';
                ctx.strokeRect(20, canvas.height - 30, 60, 8);
            } else {
                ctx.fillStyle = '#00ffff';
                ctx.font = '10px Arial';
                ctx.textAlign = 'left';
                ctx.fillText('DASH READY [SPACE]', 20, canvas.height - 20);
            }

            ctx.restore();
        }

        function adjustColor(color, amount) {
            const hex = color.replace('#', '');
            const r = Math.max(0, Math.min(255, parseInt(hex.substr(0, 2), 16) + amount));
            const g = Math.max(0, Math.min(255, parseInt(hex.substr(2, 2), 16) + amount));
            const b = Math.max(0, Math.min(255, parseInt(hex.substr(4, 2), 16) + amount));
            return `rgb(${r}, ${g}, ${b})`;
        }

        function updateUI() {
            document.getElementById('score').textContent = score.toLocaleString();
            document.getElementById('multiplier').textContent = `x${multiplier}`;
            document.getElementById('orbs').textContent = orbsCollected;
        }

        function gameOver() {
            gameState = 'gameover';
            playSound('hit');
            playSound('gameover');
            
            // Explosion effect
            for (let i = 0; i < 50; i++) {
                createParticles(player.x, player.y, player.color, 1, 15);
            }
            
            shakeTimer = 30;
            shakeIntensity = 20;

            if (score > highScore) {
                highScore = score;
                try {
                    localStorage.setItem('neonRushHighScore', highScore);
                } catch(e) {}
            }

            document.getElementById('finalScore').textContent = score.toLocaleString();
            document.getElementById('finalOrbs').textContent = orbsCollected;
            document.getElementById('finalCombo').textContent = maxCombo;
            document.getElementById('finalHighScore').textContent = highScore.toLocaleString();
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function startGame() {
            initAudio();
            
            gameState = 'playing';
            score = 0;
            orbsCollected = 0;
            multiplier = 1;
            combo = 0;
            maxCombo = 0;
            comboTimer = 0;
            gameSpeed = 3;
            obstacles = [];
            collectibles = [];
            powerups = [];
            particles = [];
            activePowerups = {};
            
            player.x = canvas.width / 2;
            player.y = canvas.height - 80;
            player.dx = 0;
            player.trail = [];
            player.dashing = false;
            player.dashCooldown = 0;
            player.dashDuration = 0;
            player.invincible = false;
            player.invincibleTimer = 0;
            player.shield = false;
            player.magnet = false;
            player.slowTime = false;
            
            updateUI();
            updatePowerupDisplay();

            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('pauseScreen').classList.add('hidden');
        }

        function togglePause() {
            if (gameState === 'playing') {
                gameState = 'paused';
                document.getElementById('pauseScreen').classList.remove('hidden');
            } else if (gameState === 'paused') {
                gameState = 'playing';
                document.getElementById('pauseScreen').classList.add('hidden');
            }
        }

        // Game Loop
        function gameLoop(timestamp) {
            deltaTime = Math.min((timestamp - lastTime) / 1000, 0.05);
            lastTime = timestamp;

            update(deltaTime);
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Event Listeners
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.key === ' ' && gameState === 'playing') {
                e.preventDefault();
                dash();
            }
            
            if (e.key === 'p' || e.key === 'P') {
                togglePause();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Touch controls for mobile
        let touchStartX = null;
        canvas.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        });
        
        canvas.addEventListener('touchmove', (e) => {
            if (touchStartX === null) return;
            const touchX = e.touches[0].clientX;
            const diff = touchX - touchStartX;
            
            if (diff < -20) {
                keys['ArrowLeft'] = true;
                keys['ArrowRight'] = false;
            } else if (diff > 20) {
                keys['ArrowRight'] = true;
                keys['ArrowLeft'] = false;
            }
            
            touchStartX = touchX;
        });
        
        canvas.addEventListener('touchend', () => {
            keys['ArrowLeft'] = false;
            keys['ArrowRight'] = false;
            touchStartX = null;
        });

        // Button listeners
        document.getElementById('playBtn').addEventListener('click', startGame);
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('pauseBtn').addEventListener('click', togglePause);
        document.getElementById('resumeBtn').addEventListener('click', togglePause);
        document.getElementById('retryBtn').addEventListener('click', startGame);

        // Init
        updateUI();
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
