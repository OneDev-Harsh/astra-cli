name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smoke-test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Execution Environment
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Cache & Install Workspace Dependencies
        run: bun install

      - name: Run Test Suite Infrastructure
        run: bun test